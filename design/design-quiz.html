<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MicroCure — Design Interrogation</title>
<style>
  :root{
    --bg:#040709;
    --bg-2:#061016;
    --panel:#081318;
    --panel-2:#0b1a21;
    --ink:#e9f6f2;
    --muted:#8aa4a6;
    --teal:#4ff5cf;
    --teal-dim:#2b9f8b;
    --teal-soft:rgba(79,245,207,.1);
    --magenta:#ff5aa5;
    --amber:#ffc96b;
    --red:#ff6b78;
    --line:rgba(147,220,210,.14);
    --line-strong:rgba(147,220,210,.3);
    --mono:"SFMono-Regular", "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    min-height:100vh;
    background:
      radial-gradient(1100px 700px at 85% -10%, rgba(255,90,165,.07), transparent 60%),
      radial-gradient(900px 650px at 5% 105%, rgba(79,245,207,.06), transparent 55%),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  button{font:inherit;color:inherit}
  ::selection{background:rgba(79,245,207,.28);color:#fff}
  .bg-grid{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(120,220,210,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(120,220,210,.035) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 15%, #000 0%, transparent 78%);
    mask-image:radial-gradient(ellipse at 50% 15%, #000 0%, transparent 78%);
  }
  .app{
    position:relative;z-index:1;
    display:grid;
    grid-template-columns:296px minmax(0,1fr);
    width:100%;max-width:1460px;margin:0 auto;
    min-height:100vh;
  }

  /* ---------- RAIL ---------- */
  .rail{
    position:sticky;top:0;height:100vh;overflow-y:auto;min-width:0;
    display:flex;flex-direction:column;gap:22px;
    padding:30px 22px 24px;
    background:rgba(4,9,11,.78);
    border-right:1px solid var(--line);
    backdrop-filter:blur(14px);
    scrollbar-width:thin;
  }
  .brand{display:flex;align-items:center;gap:12px}
  .mark{
    width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;
    color:var(--teal);font-size:18px;font-weight:400;
    border:1px solid rgba(79,245,207,.45);
    background:linear-gradient(135deg, rgba(79,245,207,.14), rgba(79,245,207,.02));
    box-shadow:0 0 18px rgba(79,245,207,.12), inset 0 0 16px rgba(79,245,207,.05);
  }
  .brand-name{font-family:var(--mono);font-size:14px;letter-spacing:3px;color:var(--ink)}
  .brand-sub{font-family:var(--mono);font-size:8.5px;letter-spacing:1.7px;color:var(--muted);margin-top:3px}
  .ecg{width:100%;height:34px;overflow:visible;opacity:.8}
  .ecg polyline{
    fill:none;stroke:var(--teal);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;
    vector-effect:non-scaling-stroke;
    stroke-dasharray:280;
    filter:drop-shadow(0 0 4px rgba(79,245,207,.45));
    animation:ecg 4.5s linear infinite;
  }
  @keyframes ecg{from{stroke-dashoffset:280}to{stroke-dashoffset:-280}}
  .progress-card{
    border:1px solid var(--line);background:linear-gradient(180deg, rgba(11,26,33,.72), rgba(6,14,18,.4));
    padding:13px 13px 11px;
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--mono);font-size:9px;letter-spacing:1.3px;color:var(--muted)}
  .progress-top strong{color:var(--teal);font-size:10px;font-weight:400}
  .progress-track{height:4px;background:rgba(255,255,255,.07);margin-top:9px;overflow:hidden}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg, var(--teal-dim), var(--teal));box-shadow:0 0 10px rgba(79,245,207,.5);transition:width .3s ease}
  .save-line{display:flex;align-items:center;gap:6px;margin-top:9px;font-family:var(--mono);font-size:8.5px;color:var(--muted);letter-spacing:.4px}
  .pulse{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  .section-nav{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nav-item{
    display:grid;grid-template-columns:23px minmax(0,1fr) auto;gap:8px;align-items:center;
    width:100%;padding:9px 9px;border:1px solid transparent;border-left:2px solid transparent;
    background:none;text-align:left;cursor:pointer;color:var(--muted);
    font-size:11.5px;letter-spacing:.2px;
    transition:background .16s,color .16s,border-color .16s;
  }
  .nav-item:hover{color:var(--ink);background:rgba(255,255,255,.03)}
  .nav-item.active{color:var(--ink);background:linear-gradient(90deg, rgba(79,245,207,.1), transparent);border-left-color:var(--teal)}
  .nav-num{font-family:var(--mono);font-size:9px;color:var(--teal-dim)}
  .nav-item.active .nav-num{color:var(--teal)}
  .nav-title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nav-count{font-family:var(--mono);font-size:8.5px;color:var(--muted);opacity:.8}
  .nav-item.done .nav-count{color:var(--teal)}
  .rail-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px}
  .ghost-btn{
    background:none;border:1px solid transparent;color:var(--muted);
    font-family:var(--mono);font-size:9.5px;letter-spacing:1px;text-transform:uppercase;
    padding:5px 0;cursor:pointer;transition:color .16s;
  }
  .ghost-btn:hover{color:var(--teal)}
  .rail-foot p{font-family:var(--mono);font-size:8.5px;color:rgba(138,164,166,.65);margin-top:5px;line-height:1.5}

  /* ---------- MAIN ---------- */
  .main{min-width:0;width:100%;max-width:1040px;margin:0 auto;padding:28px clamp(22px,4vw,54px) 34px;display:flex;flex-direction:column}
  .topline{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:38px}
  .crumb{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9.5px;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;min-width:0}
  .crumb .dot{width:3px;height:3px;background:var(--teal);border-radius:50%;box-shadow:0 0 6px var(--teal);flex:0 0 auto}
  .crumb span{white-space:nowrap}
  .crumb span:last-child{overflow:hidden;text-overflow:ellipsis;color:rgba(138,164,166,.7)}
  .top-actions{flex:0 0 auto}
  .top-actions .ghost-btn{color:var(--teal);border-color:rgba(79,245,207,.25);padding:6px 10px;transition:background .16s,border-color .16s}
  .top-actions .ghost-btn:hover{background:rgba(79,245,207,.08);border-color:var(--teal)}

  .section-head{margin-bottom:26px}
  .kicker{font-family:var(--mono);font-size:9.5px;letter-spacing:2.6px;text-transform:uppercase;color:var(--teal)}
  .section-head h1{
    font-size:clamp(38px, 5.2vw, 58px);line-height:1.02;letter-spacing:-1.8px;font-weight:650;
    margin:11px 0 13px;
  }
  .section-blurb{max-width:660px;color:var(--muted);font-size:14px;line-height:1.65}
  .intro{
    display:grid;grid-template-columns:1.4fr 1fr;gap:24px;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:18px 0;margin:24px 0 4px;
  }
  .intro p{color:var(--muted);font-size:13px;line-height:1.7}
  .intro p strong{color:var(--ink);font-weight:600}
  .intro-meta{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
  .meta-chip{font-family:var(--mono);font-size:8.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--teal);border:1px solid rgba(79,245,207,.25);background:rgba(79,245,207,.05);padding:5px 7px;white-space:nowrap}

  .q{
    position:relative;
    border:1px solid var(--line);
    background:linear-gradient(180deg, rgba(10,25,30,.62), rgba(6,14,18,.58));
    padding:22px 22px 20px;
    margin-top:15px;
  }
  .q::before{content:"";position:absolute;left:-1px;top:-1px;width:38px;height:1px;background:var(--teal);opacity:.65}
  .q-top{display:flex;align-items:baseline;gap:12px}
  .q-index{font-family:var(--mono);font-size:9.5px;letter-spacing:.6px;color:var(--teal-dim);flex:0 0 auto;padding-top:2px}
  .q h3{font-size:16.5px;line-height:1.4;font-weight:600;letter-spacing:-.1px}
  .why{color:var(--muted);font-size:12px;line-height:1.55;margin:7px 0 0 34px;max-width:720px}
  .q-note{
    display:inline-block;margin:9px 0 0 34px;padding:3px 6px;
    font-family:var(--mono);font-size:8px;letter-spacing:1.1px;text-transform:uppercase;
    color:var(--amber);border:1px solid rgba(255,201,107,.28);background:rgba(255,201,107,.05);
  }
  .opts{display:grid;gap:7px;margin:14px 0 0 34px}
  .opt{
    display:grid;grid-template-columns:17px minmax(0,1fr);gap:11px;align-items:start;
    width:100%;padding:11px 13px;text-align:left;cursor:pointer;
    border:1px solid rgba(255,255,255,.075);
    background:rgba(255,255,255,.018);
    transition:border-color .15s,background .15s,transform .15s;
  }
  .opt:hover{border-color:rgba(79,245,207,.42);background:rgba(79,245,207,.04)}
  .opt:focus-visible{outline:1px solid var(--teal);outline-offset:2px}
  .mark{
    width:15px;height:15px;margin-top:2px;border:1px solid rgba(138,164,166,.55);border-radius:50%;
    display:grid;place-items:center;transition:border-color .15s,background .15s,box-shadow .15s;flex:0 0 auto;
  }
  .mark::after{content:"";width:5px;height:5px;border-radius:50%;background:#03100d;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}
  .multi-q .mark{border-radius:3px}
  .opt[aria-checked="true"]{border-color:rgba(79,245,207,.58);background:linear-gradient(90deg, rgba(79,245,207,.105), rgba(79,245,207,.02))}
  .opt[aria-checked="true"] .mark{border-color:var(--teal);background:var(--teal);box-shadow:0 0 10px rgba(79,245,207,.35)}
  .opt[aria-checked="true"] .mark::after{opacity:1;transform:scale(1)}
  .copy{min-width:0}
  .label{display:block;color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.35}
  .detail{display:block;color:var(--muted);font-size:12px;line-height:1.5;margin-top:2px}
  .q.nudge{animation:nudge .3s ease}
  @keyframes nudge{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .sec-actions{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
  .sec-progress{font-family:var(--mono);font-size:9px;letter-spacing:.7px;color:var(--muted);text-transform:uppercase}
  .sec-progress b{color:var(--teal);font-weight:400}
  .actions-group{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    appearance:none;cursor:pointer;border:1px solid var(--line-strong);background:rgba(255,255,255,.025);
    color:var(--ink);padding:10px 15px;font-family:var(--mono);font-size:10px;letter-spacing:1.15px;
    text-transform:uppercase;transition:background .16s,border-color .16s,color .16s,box-shadow .16s;
  }
  .btn:hover{border-color:var(--teal);color:var(--teal);background:rgba(79,245,207,.06)}
  .btn.primary{background:var(--teal);border-color:var(--teal);color:#02100c;font-weight:700;box-shadow:0 0 26px rgba(79,245,207,.16)}
  .btn.primary:hover{background:#93ffe2;border-color:#93ffe2;color:#02100c;box-shadow:0 0 34px rgba(79,245,207,.26)}
  .btn.ghost{background:none;border-color:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--teal);border-color:var(--line)}
  .btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
  .btn:disabled:hover{background:rgba(255,255,255,.025);border-color:var(--line-strong);color:var(--ink)}

  .notes-card{margin-top:18px;border:1px dashed rgba(147,220,210,.25);background:rgba(8,19,24,.5);padding:18px}
  .notes-card label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--teal)}
  .notes-card .notes-hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
  textarea{
    width:100%;min-height:98px;margin-top:11px;resize:vertical;padding:11px 12px;
    background:#040c10;border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:13px;line-height:1.6;outline:none;
  }
  textarea:focus{border-color:rgba(79,245,207,.6);box-shadow:0 0 0 2px rgba(79,245,207,.06)}
  textarea::placeholder{color:rgba(138,164,166,.5)}

  /* ---------- RESULTS ---------- */
  .results-head h1{font-size:clamp(38px,5.4vw,62px);letter-spacing:-2px;line-height:1.02;margin:10px 0 14px}
  .results-head p{max-width:660px;color:var(--muted);font-size:14px;line-height:1.65}
  .fingerprint{display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:7px;margin:26px 0 8px}
  .fp{border:1px solid var(--line);background:rgba(8,19,24,.6);padding:12px;min-height:78px}
  .fp-label{font-family:var(--mono);font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}
  .fp-value{margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--ink)}
  .fp.missing .fp-value{color:rgba(138,164,166,.65);font-style:italic}
  .warning{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    border:1px solid rgba(255,201,107,.28);background:rgba(255,201,107,.05);
    padding:10px 13px;margin:14px 0 0;
  }
  .warning p{font-size:12px;color:var(--amber);line-height:1.5}
  .warning .ghost-btn{color:var(--amber)}
  .brief-shell{border:1px solid var(--line);background:#040b0f;margin-top:20px}
  .brief-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 13px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase}
  .brief-bar .live{display:inline-flex;align-items:center;gap:6px;color:var(--teal)}
  .brief-actions{display:flex;gap:6px;flex-wrap:wrap}
  .brief-actions .btn{padding:6px 9px;font-size:8.5px}
  .brief{
    max-height:440px;overflow:auto;padding:18px;white-space:pre-wrap;word-break:break-word;
    font-family:var(--mono);font-size:11px;line-height:1.65;color:#c7ded9;
    scrollbar-width:thin;
  }
  .result-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
  .main-foot{
    margin-top:auto;padding-top:30px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
    font-family:var(--mono);font-size:8.5px;letter-spacing:.8px;color:rgba(138,164,166,.55);text-transform:uppercase;
  }

  #toast{
    position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);
    z-index:50;padding:9px 14px;border:1px solid rgba(79,245,207,.4);
    background:rgba(4,14,15,.96);color:var(--teal);
    font-family:var(--mono);font-size:10px;letter-spacing:.8px;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
    box-shadow:0 4px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:1020px){
    .app{grid-template-columns:minmax(0,1fr)}
    .rail{position:relative;top:auto;height:auto;width:100%;max-width:100vw;overflow:visible;border-right:none;border-bottom:1px solid var(--line);padding:20px 20px 16px;gap:15px}
    .brand{justify-content:flex-start}
    .ecg{height:24px;max-width:260px}
    .progress-card{max-width:420px}
    .section-nav{flex-direction:row;width:100%;max-width:100%;overflow-x:auto;gap:6px;padding-bottom:4px;scrollbar-width:thin}
    .nav-item{grid-template-columns:20px auto auto;min-width:172px;border:1px solid var(--line);border-left-width:1px;padding:8px 9px}
    .nav-item.active{border-color:rgba(79,245,207,.45);border-left-color:rgba(79,245,207,.45)}
    .rail-foot{display:none}
    .main{max-width:none;padding-top:26px}
  }
  @media (max-width:640px){
    .main{padding:20px 15px 30px}
    .topline{margin-bottom:28px}
    .crumb span:last-child{display:none}
    .section-head h1{font-size:36px;letter-spacing:-1.2px}
    .intro{grid-template-columns:1fr;gap:12px;padding:15px 0}
    .q{padding:18px 15px}
    .q .opts{margin-left:0}
    .why,.q-note{margin-left:0}
    .opt{padding:10px 11px}
    .sec-actions{align-items:stretch;flex-direction:column}
    .actions-group{width:100%}
    .actions-group .btn{flex:1}
    .sec-progress{text-align:center;order:2}
    .brief{font-size:10px;padding:13px;max-height:360px}
    .brief-bar{align-items:flex-start;flex-direction:column}
    .fingerprint{grid-template-columns:1fr 1fr}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{animation:none!important;transition:none!important}
  }
  @media print{
    body{background:#fff;color:#111}
    .bg-grid,.rail,.topline,.main-foot,.result-actions,.brief-actions,.warning,#toast,.results-head,.fingerprint{display:none!important}
    .app{display:block}
    .main{max-width:none;padding:0}
    .brief-shell{border:0;margin:0;background:#fff}
    .brief-bar{border-bottom:1px solid #bbb;color:#333;background:#fff}
    .brief{max-height:none;overflow:visible;color:#111;background:#fff;font-size:10px;padding:0}
  }
</style>
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark" aria-hidden="true">✚</div>
      <div>
        <div class="brand-name">MICROCURE</div>
        <div class="brand-sub">DESIGN INTERROGATION</div>
      </div>
    </div>
    <svg class="ecg" viewBox="0 0 280 34" preserveAspectRatio="none" aria-hidden="true">
      <polyline points="0,18 44,18 52,18 57,5 63,29 69,18 104,18 113,18 118,11 123,24 128,18 176,18 184,18 189,7 194,27 199,18 280,18"/>
    </svg>
    <div class="progress-card">
      <div class="progress-top"><span>ANSWERS</span><strong id="progressCount">0 / 0</strong></div>
      <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      <div class="save-line"><span class="pulse"></span><span id="saveStatus">Autosaves in this browser</span></div>
    </div>
    <nav class="section-nav" id="sectionNav" aria-label="Quiz sections"></nav>
    <div class="rail-foot">
      <button type="button" class="ghost-btn" id="briefNavBtn">Generate design brief →</button>
      <button type="button" class="ghost-btn" id="resetBtn">Reset all answers</button>
      <p>Answers stay in this browser. Nothing is uploaded.</p>
    </div>
  </aside>

  <main class="main">
    <div class="topline">
      <div class="crumb">
        <span id="crumbNum">SECTION 01 / 10</span>
        <span class="dot" aria-hidden="true"></span>
        <span>MicroCure // pre-production</span>
      </div>
      <div class="top-actions">
        <button type="button" class="ghost-btn" id="briefTopBtn">View design brief</button>
      </div>
    </div>

    <div id="view"></div>

    <footer class="main-foot">
      <span>82 decisions. One game.</span>
      <span>Autosaved locally · exportable as Markdown</span>
    </footer>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   MICROCURE — DESIGN INTERROGATION
   A self-contained design questionnaire.
   ============================================================ */

const SECTIONS = [
  {
    id: 'north',
    num: '01',
    title: 'North Star',
    blurb: 'The reason the game exists, and the line it must not cross.',
    qs: [
      {
        id: 'fullgame',
        q: 'What does “full-fledged” mean to you?',
        why: 'This decides scope, engine, content volume, and what “done” means. Pick the outcome, not the genre.',
        o: [
          [`Premium PC indie game`, `A paid Steam release: 8–12 hour campaign, controller support, achievements, a store page.`],
          [`Replayable roguelite`, `Short runs, deep builds, endless mode, score chasing. Content is reused, not authored once.`],
          [`Story-driven campaign`, `Authored cases, characters and set pieces. Less randomness, more handcrafted moments.`],
          [`Shareable browser game`, `Instant play, free, link-driven. Smaller scope per session and no install.`],
          [`Commercial live game`, `Seasons, updates, monetization and online operations. The largest production burden.`]
        ]
      },
      {
        id: 'fantasy',
        q: 'Which power fantasy should the player live?',
        why: 'The fantasy sets the camera, the pacing, the enemy density and the tone of every line of copy.',

const STORE_KEY = 'microcure-design-lock-v1';
const TOTAL = SECTIONS.reduce((n, s) => n + s.qs.length, 0);
const Q_BY_ID = {};
SECTIONS.forEach(sec => sec.qs.forEach(q => { Q_BY_ID[q.id] = q; }));

let state = { answers: {}, notes: '', section: 0 };
let generated = false;
let saveTimer = null;

const view = document.getElementById('view');
const sectionNav = document.getElementById('sectionNav');
const progressCount = document.getElementById('progressCount');
const progressBar = document.getElementById('progressBar');
const saveStatus = document.getElementById('saveStatus');
const crumbNum = document.getElementById('crumbNum');
const briefTopBtn = document.getElementById('briefTopBtn');
const briefNavBtn = document.getElementById('briefNavBtn');
const toastEl = document.getElementById('toast');

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function isAnswered(id) {
  const a = state.answers[id];
  return Array.isArray(a) ? a.length > 0 : typeof a === 'string' && a.length > 0;
}

function answeredCount() {
  return Object.keys(Q_BY_ID).filter(isAnswered).length;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return;
    if (parsed.answers && typeof parsed.answers === 'object') state.answers = parsed.answers;
    if (typeof parsed.notes === 'string') state.notes = parsed.notes;
    if (Number.isInteger(parsed.section)) state.section = Math.max(0, Math.min(SECTIONS.length - 1, parsed.section));
  } catch (e) { /* storage unavailable — the quiz still works in memory */ }
}

function persistNow() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) { /* storage unavailable — the quiz still works in memory */ }
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      saveStatus.textContent = 'Saved just now';
      saveStatus.style.color = 'var(--teal)';
      setTimeout(() => {
        saveStatus.textContent = 'Autosaved in this browser';
        saveStatus.style.color = '';
      }, 1300);
    } catch (e) {
      saveStatus.textContent = 'Local save unavailable';
      saveStatus.style.color = 'var(--amber)';
    }
  }, 120);
}

window.addEventListener('pagehide', persistNow);

function toast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove('show'), 1900);
}

/* ---------- RENDERING ---------- */
function render() {
  renderNav();
  renderProgress();
  renderView();
  updateChrome();
}

function updateChrome() {
  const isResults = generated;
  crumbNum.textContent = isResults
    ? 'DESIGN LOCK / COMPLETE'
    : 'SECTION ' + SECTIONS[state.section].num + ' / ' + String(SECTIONS.length).padStart(2, '0');
  briefTopBtn.textContent = isResults ? '← Edit answers' : 'View design brief';
  briefNavBtn.textContent = isResults ? '← Edit answers' : 'Generate design brief →';
}

function renderNav() {
  sectionNav.innerHTML = SECTIONS.map((sec, index) => {
    const answered = sec.qs.filter(q => isAnswered(q.id)).length;
    const cls = [
      'nav-item',
      index === state.section && !generated ? 'active' : '',
      answered === sec.qs.length ? 'done' : ''
    ].filter(Boolean).join(' ');
    return '<button type="button" class="' + cls + '" data-section="' + index + '">' +
      '<span class="nav-num">' + sec.num + '</span>' +
      '<span class="nav-title">' + esc(sec.title) + '</span>' +
      '<span class="nav-count">' + answered + '/' + sec.qs.length + '</span>' +
      '</button>';
  }).join('');
}

function renderProgress() {
  const n = answeredCount();
  progressCount.textContent = n + ' / ' + TOTAL;
  progressBar.style.width = (TOTAL ? (n / TOTAL) * 100 : 0) + '%';
}

function renderView() {
  if (generated) {
    renderResults();
    return;
  }
  const sec = SECTIONS[state.section];
  const sectionAnswered = sec.qs.filter(q => isAnswered(q.id)).length;
  const intro = state.section === 0
    ? '<div class="intro">' +
        '<p><strong>Answer as the person who will actually build this</strong>, not as the person who wants the biggest possible game. Every choice can be changed later; the brief is the point. There are no correct answers here — only commitments.</p>' +
        '<div class="intro-meta">' +
          '<span class="meta-chip">' + TOTAL + ' questions</span>' +
          '<span class="meta-chip">10 sections</span>' +
          '<span class="meta-chip">~15–20 min</span>' +
          '<span class="meta-chip">Autosaves</span>' +
          '<span class="meta-chip">Markdown export</span>' +
        '</div>' +
      '</div>'
    : '';

  const questions = sec.qs.map((q, i) => renderQuestion(sec, q, i)).join('');
  const notes = state.section === SECTIONS.length - 1
    ? '<div class="notes-card">' +
        '<label for="notes">Anything the quiz did not ask?</label>' +
        '<p class="notes-hint">A mechanic, reference, constraint, dream feature, or dealbreaker. Notes are appended to the brief.</p>' +
        '<textarea id="notes" maxlength="1600" placeholder="Optional. Example: I want a mode where a second player controls the immune system…">' + esc(state.notes) + '</textarea>' +
      '</div>'
    : '';

  const isLast = state.section === SECTIONS.length - 1;
  const nextAction = isLast
    ? '<button type="button" class="btn primary" id="finishBtn">Generate design lock →</button>'
    : '<button type="button" class="btn primary" id="nextBtn">Next section →</button>';

  view.innerHTML =
    '<div class="section-head">' +
      '<div class="kicker">Section ' + sec.num + ' / ' + String(SECTIONS.length).padStart(2, '0') + '</div>' +
      '<h1>' + esc(sec.title) + '</h1>' +
      '<p class="section-blurb">' + esc(sec.blurb) + '</p>' +
    '</div>' +
    intro +
    questions +
    notes +
    '<div class="sec-actions">' +
      '<div class="actions-group">' +
        '<button type="button" class="btn ghost" id="prevBtn"' + (state.section === 0 ? ' disabled' : '') + '>← Back</button>' +
      '</div>' +
      '<div class="sec-progress"><b>' + sectionAnswered + '</b> / ' + sec.qs.length + ' answered in this section</div>' +
      '<div class="actions-group">' + nextAction + '</div>' +
    '</div>';
}

function renderQuestion(sec, q, index) {
  const selected = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : (isAnswered(q.id) ? [state.answers[q.id]] : []);
  const multi = !!q.multi;
  const opts = q.o.map((opt, oi) => {
    const on = selected.includes(opt[0]);
    return '<button type="button" class="opt" role="' + (multi ? 'checkbox' : 'radio') + '" aria-checked="' + on + '" data-qid="' + q.id + '" data-oi="' + oi + '">' +
      '<span class="mark" aria-hidden="true"></span>' +
      '<span class="copy"><span class="label">' + esc(opt[0]) + '</span><span class="detail">' + esc(opt[1]) + '</span></span>' +
      '</button>';
  }).join('');

  return '<article class="q' + (multi ? ' multi-q' : '') + '" data-card="' + q.id + '">' +
    '<div class="q-top"><span class="q-index">' + sec.num + '.' + String(index + 1).padStart(2, '0') + '</span><h3>' + esc(q.q) + '</h3></div>' +
    '<p class="why">' + esc(q.why) + '</p>' +
    (multi ? '<div class="q-note">Choose up to ' + q.multi + '</div>' : '') +
    '<div class="opts" role="' + (multi ? 'group' : 'radiogroup') + '" aria-label="' + esc(q.q) + '">' + opts + '</div>' +
    '</article>';
}

function paintQuestion(q) {
  const selected = Array.isArray(state.answers[q.id]) ? state.answers[q.id] : (isAnswered(q.id) ? [state.answers[q.id]] : []);
  document.querySelectorAll('.opt[data-qid="' + q.id + '"]').forEach(btn => {
    const opt = q.o[Number(btn.dataset.oi)];
    btn.setAttribute('aria-checked', String(selected.includes(opt[0])));
  });
}

function choose(qid, oi) {
  const q = Q_BY_ID[qid];
  if (!q || !q.o[oi]) return;
  const label = q.o[oi][0];

  if (q.multi) {
    const current = Array.isArray(state.answers[qid]) ? [...state.answers[qid]] : [];
    const at = current.indexOf(label);
    if (at >= 0) {
      current.splice(at, 1);
    } else {
      if (current.length >= q.multi) {
        toast('Pick up to ' + q.multi + ' for this question.');
        const card = document.querySelector('.q[data-card="' + qid + '"]');
        if (card) {
          card.classList.remove('nudge');
          void card.offsetWidth;
          card.classList.add('nudge');
        }
        return;
      }
      current.push(label);
    }
    if (current.length) state.answers[qid] = current;
    else delete state.answers[qid];
  } else {
    if (state.answers[qid] === label) delete state.answers[qid];
    else state.answers[qid] = label;
  }

  paintQuestion(q);
  renderProgress();
  renderNav();
  persist();
}

function getAnswerText(id) {
  const a = state.answers[id];
  if (!a) return '';
  return Array.isArray(a) ? a.join(' · ') : a;
}

/* ---------- NAVIGATION ---------- */
function goToSection(index) {
  const next = Math.max(0, Math.min(SECTIONS.length - 1, index));
  generated = false;
  state.section = next;
  render();
  persist();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function finish() {
  generated = true;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ---------- BRIEF ---------- */
function buildBrief() {
  const n = answeredCount();
  const date = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
  const lines = [];
  lines.push('# MICROCURE — DESIGN LOCK');
  lines.push('');
  lines.push('_Generated ' + date + ' — ' + n + ' of ' + TOTAL + ' questions answered._');
  lines.push('');
  lines.push('## FINGERPRINT');
  FINGERPRINT.forEach(([label, id]) => {
    const value = getAnswerText(id) || '_(unanswered)_';
    lines.push('- **' + label + ':** ' + value);
  });
  lines.push('');
  lines.push('## DECISIONS');
  SECTIONS.forEach(sec => {
    lines.push('');
    lines.push('### ' + sec.num + ' — ' + sec.title);
    sec.qs.forEach(q => {
      const value = getAnswerText(q.id) || '_(unanswered)_';
      lines.push('- **' + q.q + '**');
      lines.push('  → ' + value);
    });
  });
  if (state.notes.trim()) {
    lines.push('');
    lines.push('## NOTES');
    lines.push(state.notes.trim());
  }
  lines.push('');
  lines.push('---');
  lines.push('_Paste this brief into the MicroCure chat. The next step is the vertical-slice plan._');
  return lines.join('\n');
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text);
  }
  return new Promise((resolve, reject) => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      resolve();
    } catch (e) {
      reject(e);
    } finally {
      ta.remove();
    }
  });
}

function downloadBrief() {
  const brief = buildBrief();
  const blob = new Blob([brief], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'microcure-design-lock.md';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Downloaded microcure-design-lock.md');
}

function renderResults() {
  const brief = buildBrief();
  const unanswered = TOTAL - answeredCount();
  const fps = FINGERPRINT.map(([label, id]) => {
    const value = getAnswerText(id);
    return '<div class="fp' + (value ? '' : ' missing') + '">' +
      '<div class="fp-label">' + label + '</div>' +
      '<div class="fp-value">' + (value ? esc(value) : 'Not answered yet') + '</div>' +
    '</div>';
  }).join('');

  const warning = unanswered > 0
    ? '<div class="warning"><p>' + unanswered + ' question' + (unanswered === 1 ? ' is' : 's are') + ' still unanswered. They will be marked in the brief.</p>' +
      '<button type="button" class="ghost-btn" id="reviewBtn">Review unanswered →</button></div>'
    : '';

  view.innerHTML =
    '<div class="results-head">' +
      '<div class="kicker">Design lock / complete</div>' +
      '<h1>The game,<br>on one page.</h1>' +
      '<p>This is the design brief. Copy it, download it, or paste it back into the MicroCure thread. It is specific enough to build from and short enough to keep on one screen.</p>' +
    '</div>' +
    '<div class="fingerprint">' + fps + '</div>' +
    warning +
    '<div class="brief-shell">' +
      '<div class="brief-bar">' +
        '<span class="live"><span class="pulse"></span> design_brief.md</span>' +
        '<div class="brief-actions">' +
          '<button type="button" class="btn" id="copyBtn">Copy</button>' +
          '<button type="button" class="btn" id="downloadBtn">Download .md</button>' +
          '<button type="button" class="btn" id="printBtn">Print</button>' +
        '</div>' +
      '</div>' +
      '<pre class="brief" id="briefText"></pre>' +
    '</div>' +
    '<div class="result-actions">' +
      '<button type="button" class="btn primary" id="backToQuestions">← Edit answers</button>' +
      '<button type="button" class="btn ghost" id="restartBtn">Start over</button>' +
    '</div>';

  document.getElementById('briefText').textContent = brief;

  document.getElementById('copyBtn').addEventListener('click', () => {
    copyText(brief).then(() => toast('Brief copied to clipboard')).catch(() => toast('Copy failed — select the text manually'));
  });
  document.getElementById('downloadBtn').addEventListener('click', downloadBrief);
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  document.getElementById('backToQuestions').addEventListener('click', () => {
    generated = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  document.getElementById('restartBtn').addEventListener('click', resetAll);
  const reviewBtn = document.getElementById('reviewBtn');
  if (reviewBtn) {
    reviewBtn.addEventListener('click', () => {
      const index = SECTIONS.findIndex(sec => sec.qs.some(q => !isAnswered(q.id)));
      goToSection(index < 0 ? 0 : index);
    });
  }
}

/* ---------- RESET ---------- */
function resetAll() {
  if (!window.confirm('Erase every answer and start over? This cannot be undone.')) return;
  state = { answers: {}, notes: '', section: 0 };
  generated = false;
  try { localStorage.removeItem(STORE_KEY); } catch (e) { /* ignore */ }
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  toast('All answers cleared');
}

/* ---------- EVENTS ---------- */
view.addEventListener('click', (event) => {
  const opt = event.target.closest('.opt');
  if (opt) {
    choose(opt.dataset.qid, Number(opt.dataset.oi));
    return;
  }
  if (event.target.closest('#prevBtn')) { goToSection(state.section - 1); return; }
  if (event.target.closest('#nextBtn')) { goToSection(state.section + 1); return; }
  if (event.target.closest('#finishBtn')) { finish(); return; }
});

view.addEventListener('input', (event) => {
  if (event.target.id === 'notes') {
    state.notes = event.target.value;
    persist();
  }
});

sectionNav.addEventListener('click', (event) => {
  const btn = event.target.closest('.nav-item');
  if (btn) goToSection(Number(btn.dataset.section));
});

briefTopBtn.addEventListener('click', () => {
  if (generated) {
    generated = false;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    finish();
  }
});

briefNavBtn.addEventListener('click', () => {
  if (generated) {
    generated = false;
    render();
  } else {
    finish();
  }
});

document.getElementById('resetBtn')?.addEventListener('click', resetAll);

/* ---------- BOOT ---------- */
loadState();
render();
</script>
</body>
</html>
